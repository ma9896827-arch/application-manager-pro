<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GT Pro — Professional Management System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-layout">
    <header class="app-header">
      <div class="brand">
        <div class="brand-logo" aria-label="GT Pro Logo">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
          </svg>
        </div>
        <div class="brand-title">
          <h1>GT Pro</h1>
          <span class="brand-subtitle">Application Management</span>
        </div>
      </div>
      <button class="btn btn-primary" id="openUploadModal" type="button">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 5v14M5 12h14"/>
        </svg>
        <span>Upload File</span>
      </button>
    </header>

    <main class="main-content">
      <section class="stats-grid">
        <div class="stat-card">
          <div class="stat-icon-wrapper">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2">
              <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
            </svg>
          </div>
          <div class="stat-details">
            <span class="stat-label">Total Files</span>
            <span class="stat-value" id="totalFilesCount">0</span>
          </div>
        </div>

        <div class="stat-card">
          <div class="stat-icon-wrapper success">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2">
              <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
              <polyline points="22 4 12 14.01 9 11.01"/>
            </svg>
          </div>
          <div class="stat-details">
            <span class="stat-label">Storage Engine</span>
            <span class="stat-value text-success">Active & Ready</span>
          </div>
        </div>
      </section>

      <section class="card dashboard-section">
        <div class="section-header">
          <div>
            <h2>Application Repository</h2>
            <p class="section-desc">Manage, upload and download your production builds</p>
          </div>
        </div>
        <div class="files-grid" id="filesGrid"></div>
      </section>
    </main>
  </div>

  <!-- Upload Modal -->
  <div class="modal" id="uploadModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modalTitle">Upload Application File</h2>
        <button class="icon-btn" id="closeModal" aria-label="Close dialog" type="button">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <form id="uploadForm">
        <div class="drop-zone" id="dropZone" tabindex="0" role="button" aria-label="Select file">
          <div class="drop-zone-icon">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="17 8 12 3 7 8"/>
              <line x1="12" y1="3" x2="12" y2="15"/>
            </svg>
          </div>
          <p class="drop-zone-primary">Click or drop application file here</p>
          <span class="drop-zone-sub" id="fileNameDisplay">Supports APK, ZIP, IPA, or any file</span>
          <input type="file" id="fileInput" class="visually-hidden">
        </div>

        <div class="input-group">
          <label for="customFileNameInput">File Display Name</label>
          <input type="text" id="customFileNameInput" placeholder="e.g. gt-pro-app.apk" required>
        </div>

        <div class="input-group">
          <label for="versionInput">Version Tag</label>
          <input type="text" id="versionInput" placeholder="e.g. v1.2.0" required>
        </div>

        <div class="modal-actions">
          <button type="submit" class="btn btn-primary btn-block" id="submitBtn">
            Upload File
          </button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
